          nullable: false
          description: Product ID
        credits:
          type: integer
          nullable: false
          description: Number of credits granted upon purchase
        name:
          type: string
          nullable: false
          description: Display name of the product
        url:
          type: string
          nullable: false
          description: Purchase URL
      required:
        - id
        - credits
        - name
        - url

    ExternalToolResponse:
      type: object
      properties:
        definition:
          $ref: "#/components/schemas/ExternalTool"
        is_configured:
          type: boolean
          nullable: false
          description: Whether the tool is configured
      required:
        - definition
        - is_configured

    ExternalToolProviderResponse:
      type: object
      properties:
        definition:
          $ref: "#/components/schemas/ExternalToolProvider"
        is_configured:
          type: boolean
          nullable: false
          description: Whether the provider is configured
      required:
        - definition
        - is_configured

    ExternalTool:
      type: object
      properties:
        id:
          type: string
          nullable: false
          description: Tool ID
        name:
          type: string
          nullable: false
          description: Tool name
        provider:
          $ref: "#/components/schemas/ExternalToolProvider"
        types:
          type: array
          nullable: false
          items:
            type: string
          description: Tool types/capabilities
        cost_estimate:
          $ref: "#/components/schemas/CostEstimate"
        max_input_images:
          type: integer
          nullable: false
          description: Maximum number of input images supported (0 means no image input, generation-only)
      required:
        - id
        - name
        - provider
        - types
        - cost_estimate
        - max_input_images

    ExternalToolProvider:
      type: object
      properties:
        id:
          type: string
          nullable: false
          description: Provider ID
        name:
          type: string
          nullable: false
          description: Provider name
        token_management_url:
          type: string
          nullable: false
          description: URL for managing tokens
        token_format:
          type: string
          nullable: false
          description: Expected token format
        tools:
          type: array
          nullable: false
          items:
            type: string
          description: List of tool names
      required:
        - id
        - name
        - token_management_url
        - token_format
        - tools

    CostEstimate:
      type: object
      description: Cost estimation for using an external tool (all costs in credits)
      properties:
        input_1m_tokens:
          type: number
          nullable: true
          description: Cost per 1 million input tokens in credits
        output_1m_tokens:
          type: number
          nullable: true
          description: Cost per 1 million output tokens in credits
        search_1m_tokens:
          type: number
          nullable: true
          description: Cost per 1 million search tokens in credits
        input_image_1k:
          type: number
          nullable: true
          description: Cost per 1k resolution input image in credits
        input_image_2k:
          type: number
          nullable: true
          description: Cost per 2k resolution input image in credits
        input_image_4k:
          type: number
          nullable: true
          description: Cost per 4k resolution input image in credits
        input_image_8k:
          type: number
          nullable: true
          description: Cost per 8k resolution input image in credits
        input_image_12k:
          type: number
          nullable: true
          description: Cost per 12k resolution input image in credits
        output_image_1k:
          type: number
          nullable: true
          description: Cost per 1k resolution output image in credits
        output_image_2k:
          type: number
          nullable: true
          description: Cost per 2k resolution output image in credits
        output_image_4k:
          type: number
          nullable: true
          description: Cost per 4k resolution output image in credits
        api_call:
          type: number
          nullable: true
          description: Fixed cost per API call in credits
        second_of_runtime:
          type: number
          format: float
          nullable: true
          description: Cost per second of runtime in credits
        web_search_query:
          type: number
          format: float
          nullable: true
          description: Cost per grounding web search query in credits

    UsageRecord:
      type: object
      properties:
        user_id:
          type: string
          nullable: false
          description: User ID in hexadecimal format (UUID without hyphens)
        payer_id:
          type: string
          nullable: false
          description: Payer ID in hexadecimal format (UUID without hyphens), identifying who was billed for this usage
        uses_credits:
          type: boolean
          nullable: false
          description: Whether credits were used for this usage record
        is_failed:
          type: boolean
          nullable: false
          description: Whether the tool call failed (balance is not deducted for failed calls)
        chat_id:
          type: string
          nullable: true
          description: Chat ID in hexadecimal format (UUID without hyphens, if usage was in a chat context)
        tool:
          $ref: "#/components/schemas/ExternalTool"
          nullable: false
          description: The external tool used
        tool_purpose:
          type: string
          nullable: false
          enum: [chat, reasoning, copywriting, vision, hearing, images_gen, images_edit, search, embedding, api_fiat_exchange, api_crypto_exchange, api_stock_quote, api_twitter, credit_transfer, deprecated]
          description: The purpose/type of tool usage
        timestamp:
          type: string
          nullable: false
          format: date-time
          description: When the usage occurred (ISO 8601 format with timezone, e.g. "2024-01-15T10:30:00+00:00")
        runtime_seconds:
          type: number
          format: float
          nullable: false
          description: Total runtime in seconds
        remote_runtime_seconds:
          type: number
          format: float
          nullable: true
          description: Remote runtime in seconds (if applicable)
        model_cost_credits:
          type: number
          format: float
          nullable: false
          description: Cost for model usage in credits
        remote_runtime_cost_credits:
          type: number
          format: float
          nullable: false
          description: Cost for remote runtime in credits
        api_call_cost_credits:
          type: number
          format: float
          nullable: false
          description: Cost for API call in credits
        maintenance_fee_credits:
          type: number
          format: float
          nullable: false
          description: Maintenance fee in credits
        total_cost_credits:
          type: number
          format: float
          nullable: false
          description: Total cost in credits
        input_tokens:
          type: integer
          nullable: true
          description: Input tokens used (for LLM models)
        output_tokens:
          type: integer
          nullable: true
          description: Output tokens generated (for LLM models)
        search_tokens:
          type: integer
          nullable: true
          description: Search tokens used
        total_tokens:
          type: integer
          nullable: true
          description: Total tokens used
        output_image_sizes:
          type: array
          nullable: true
          items:
            type: string
          description: Sizes of output images generated (e.g., ["1k", "2k"])
        input_image_sizes:
          type: array
          nullable: true
          items:
            type: string
          description: Sizes of input images processed
        counterpart_id:
          type: string
          nullable: true
          description: The other party's user ID in hexadecimal format (only present for credit transfer records)
        note:
          type: string
          nullable: true
          description: Optional note attached to the record (only present for credit transfer records)
        participant_details:
          $ref: "#/components/schemas/ParticipantDetails"
          nullable: true
          description: Snapshot of participant identities at record creation time
      required:
        - user_id
        - payer_id
        - uses_credits
        - is_failed
        - tool
        - tool_purpose
        - timestamp
        - runtime_seconds
        - model_cost_credits
        - remote_runtime_cost_credits
        - api_call_cost_credits
        - maintenance_fee_credits
        - total_cost_credits

    ParticipantInfo:
      type: object
      properties:
        user_id:
          type: string
          description: User ID in hexadecimal format
        full_name:
          type: string
          nullable: true
          description: User's full name at record creation time
        platform:
          type: string
          nullable: true
          description: Platform name (e.g., "Telegram", "WhatsApp")
        handle:
          type: string
          nullable: true
          description: Platform-specific handle (username or phone number)
      required:
        - user_id

    ParticipantDetails:
      type: object
      required:
        - payer
        - owner
      properties:
        payer:
          $ref: "#/components/schemas/ParticipantInfo"
          description: Who was billed for this usage
        owner:
          $ref: "#/components/schemas/ParticipantInfo"
          description: Who ran the tool (same as payer for regular and transfer usage; differs for sponsored usage)
        counterpart:
          $ref: "#/components/schemas/ParticipantInfo"
          nullable: true
          description: The other party in a credit transfer (null for non-transfer records)

    UsageAggregatesResponse:
      type: object
      properties:
        total_records:
          type: integer
          nullable: false
          description: Total number of usage records in the timeframe
        total_cost_credits:
          type: number
          format: float
          nullable: false
          description: Total cost in credits for all usage records
        total_runtime_seconds:
          type: number
          format: float
          nullable: false
          description: Total runtime in seconds for all usage records
        by_tool:
          type: object
          nullable: false
          description: Aggregated stats grouped by tool ID (keyed by tool_id for filtering)
          additionalProperties:
            $ref: "#/components/schemas/AggregateStats"
        by_purpose:
          type: object
          nullable: false
          description: Aggregated stats grouped by purpose
          additionalProperties:
            $ref: "#/components/schemas/AggregateStats"
        by_provider:
          type: object
          nullable: false
          description: Aggregated stats grouped by provider ID (keyed by provider_id for filtering)
          additionalProperties:
            $ref: "#/components/schemas/AggregateStats"
        all_tools_used:
          type: array
          nullable: false
          items:
            $ref: "#/components/schemas/ToolInfo"
          description: List of distinct tools used in the timeframe (for dropdown filters)
        all_purposes_used:
          type: array
          nullable: false
          items:
            type: string
          description: List of distinct purposes used in the timeframe (for dropdown filters)
        all_providers_used:
          type: array
          nullable: false
          items:
            $ref: "#/components/schemas/ProviderInfo"
          description: List of distinct providers used in the timeframe (for dropdown filters)
      required:
        - total_records
        - total_cost_credits
        - total_runtime_seconds
        - by_tool
        - by_purpose
        - by_provider
        - all_tools_used
        - all_purposes_used
        - all_providers_used

    AggregateStats:
      type: object
      properties:
        record_count:
          type: integer
          nullable: false
          description: Number of records
        total_cost:
          type: number
          format: float
          nullable: false
          description: Total cost in credits
      required:
        - record_count
        - total_cost

    ToolInfo:
      type: object
      properties:
        id:
          type: string
          nullable: false
          description: Tool ID for filtering (e.g., "gpt-4o", "claude-3-5-haiku-latest")
        name:
          type: string
          nullable: false
          description: Tool display name (e.g., "GPT 4o", "Claude 3.5 Haiku")
      required:
        - id
        - name

    ProviderInfo:
      type: object
      properties:
        id:
          type: string
          nullable: false
          description: Provider ID for filtering (e.g., "open-ai", "anthropic")
        name:
          type: string
          nullable: false
          description: Provider display name (e.g., "OpenAI", "Anthropic")
      required:
        - id
        - name

    PurchaseRecord:
      type: object
      properties:
        id:
          type: string
          nullable: false
          description: Purchase record ID in hexadecimal format (UUID without hyphens)
        user_id:
          type: string
          nullable: true
          description: User ID in hexadecimal format (UUID without hyphens), null if not yet bound
        seller_id:
          type: string
          nullable: false
          description: Gumroad seller ID
        sale_id:
          type: string
          nullable: false
          description: Gumroad sale ID (unique)
        sale_timestamp:
          type: string
          nullable: false
          format: date-time
          description: When the purchase occurred (ISO 8601 format with timezone, e.g. "2024-01-15T10:30:00+00:00")
        price:
          type: integer
          nullable: false
          description: Purchase price in cents
        product_id:
          type: string
          nullable: false
          description: Gumroad product ID
        product_name:
          type: string
          nullable: false
          description: Product name
        product_permalink:
          type: string
          nullable: false
          description: Product permalink URL
        short_product_id:
          type: string
          nullable: false
          description: Short product ID
        license_key:
          type: string
          nullable: true
          description: License key (if applicable)
        quantity:
          type: integer
          nullable: false
          description: Quantity purchased
        gumroad_fee:
          type: integer
          nullable: false
          description: Gumroad fee in cents
        affiliate_credit_amount_cents:
          type: integer
          nullable: false
          description: Affiliate credit amount in cents
        discover_fee_charge:
          type: boolean
          nullable: false
          description: Whether discover fee was charged
        url_params:
          type: object
          nullable: true
          description: URL parameters from the purchase
        custom_fields:
          type: object
          nullable: true
          description: Custom fields from Gumroad
        test:
          type: boolean
          nullable: false
          description: Whether this was a test purchase
        is_preorder_authorization:
          type: boolean
          nullable: false
          description: Whether this is a preorder authorization
        refunded:
          type: boolean
          nullable: false
          description: Whether this purchase was refunded
      required:
        - id
        - seller_id
        - sale_id
        - sale_timestamp
        - price
        - product_id
        - product_name
        - product_permalink
        - short_product_id
        - quantity
        - gumroad_fee
        - affiliate_credit_amount_cents
        - discover_fee_charge
        - test
        - is_preorder_authorization
        - refunded

    PurchaseAggregates:
      type: object
      properties:
        total_purchase_count:
          type: integer
          nullable: false
          description: Total number of purchases in the timeframe
        total_cost_cents:
          type: integer
          nullable: false
          description: Total revenue in cents for all purchases
        total_net_cost_cents:
          type: integer
          nullable: false
          description: Total net revenue in cents (after Gumroad fees and affiliate credits)
        by_product:
          type: object
          nullable: false
          description: Aggregated stats grouped by product ID
          additionalProperties:
            $ref: "#/components/schemas/ProductAggregateStats"
        all_products_used:
          type: array
          nullable: false
          items:
            $ref: "#/components/schemas/ProductInfo"
          description: List of distinct products purchased in the timeframe (for dropdown filters)
      required:
        - total_purchase_count
        - total_cost_cents
        - total_net_cost_cents
        - by_product
        - all_products_used

    ProductAggregateStats:
      type: object
      properties:
        record_count:
          type: integer
          nullable: false
          description: Number of purchase records
        total_cost_cents:
          type: integer
          nullable: false
          description: Total revenue in cents
        total_net_cost_cents:
          type: integer
          nullable: false
          description: Total net revenue in cents (after fees)
      required:
        - record_count
        - total_cost_cents
        - total_net_cost_cents

    ProductInfo:
      type: object
      properties:
        id:
          type: string
          nullable: false
          description: Product ID for filtering
        name:
          type: string
          nullable: false
          description: Product display name
      required:
        - id
        - name

    BindLicenseKeyPayload:
      type: object
      properties:
        license_key:
          type: string
          nullable: false
          description: License key to bind to the user's account
      required:
        - license_key

    SponsorshipsResponse:
      type: object
      properties:
        sponsorships:
          type: array
          nullable: false
          items:
            $ref: "#/components/schemas/SponsorshipInfo"
          description: List of sponsorships
        max_sponsorships:
          type: integer
          nullable: false
          description: Maximum number of sponsorships allowed
      required:
        - sponsorships
        - max_sponsorships

    SponsorshipInfo:
      type: object
      properties:
        user_id_hex:
          type: string
          nullable: false
          description: Sponsored user's ID in hexadecimal format (UUID without hyphens)
        full_name:
          type: string
          nullable: true
          description: Full name of the sponsored user
        platform_handle:
          type: string
          nullable: true
          description: Platform-specific handle of sponsored user (e.g., Telegram username, WhatsApp phone number)
        platform:
          type: string
          nullable: true
          enum: [telegram, whatsapp]
          description: Platform type where the first handle was found
        sponsored_at:
          type: string
          nullable: false
          format: date-time
          description: When the sponsorship was created
        accepted_at:
          type: string
          nullable: true
          format: date-time
          description: When the sponsorship was accepted
        is_on_waitlist:
          type: boolean
          nullable: false
          description: Whether the sponsored user is currently waitlisted
        is_invited_to_start:
          type: boolean
          nullable: false
          description: Whether the sponsored user has been invited to start
        are_policies_accepted:
          type: boolean
          nullable: false
          description: Whether the sponsored user accepted onboarding policies
      required:
        - user_id_hex
        - sponsored_at
        - is_on_waitlist
        - is_invited_to_start
        - are_policies_accepted

    SponsorshipCreateResponse:
      type: object
      properties:
        status:
          type: string
          nullable: false
          enum: [OK]
          description: Operation status
        message:
          type: string
          nullable: false
          description: Sponsorship operation message
        sponsorship:
          $ref: "#/components/schemas/SponsorshipInfo"
      required:
        - status
        - message
        - sponsorship

    StatusResponse:
      type: object
      properties:
        status:
          type: string
          nullable: false
          enum: [OK]
          description: Operation status
      required:
        - status

    ConnectKeyResponse:
      type: object
      properties:
        connect_key:
          type: string
          nullable: false
          description: Connect key, used to merge profiles from different platforms
      required:
        - connect_key

    SettingsLinkResponse:
      type: object
      properties:
        settings_link:
          type: string
          nullable: false
          description: Link to the settings page
      required:
        - settings_link

    ServiceErrorResponse:
      type: object
      description: Structured error response returned by the API for all ServiceError types
      properties:
        error_code:
          type: integer
          nullable: false
          description: Numeric error code identifying the specific error
        message:
          type: string
          nullable: false
          description: Human-readable error message (in English)
        emoji:
          type: string
          nullable: false
          description: Emoji indicator for the error category
      required:
        - error_code
        - message
        - emoji

  responses:
    UnauthorizedError:
      description: Authentication required or token expired
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                type: string
                nullable: false
                description: Error reason
            required:
              - detail

    ForbiddenError:
      description: Access denied — authorization failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ServiceErrorResponse"

    NotFoundError:
      description: Requested resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ServiceErrorResponse"

    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ServiceErrorResponse"

    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ServiceErrorResponse"
