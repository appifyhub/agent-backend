        perplexity_key:
          type: string
          nullable: true
          description: Perplexity API key (masked)
        replicate_key:
          type: string
          nullable: true
          description: Replicate API key (masked)
        rapid_api_key:
          type: string
          nullable: true
          description: RapidAPI key (masked)
        coinmarketcap_key:
          type: string
          nullable: true
          description: CoinMarketCap API key (masked)
        twelve_data_api_key:
          type: string
          nullable: true
          description: Twelve Data API key (masked)
        x_key:
          type: string
          nullable: true
          description: X / Twitter API key (masked)
        x_ai_key:
          type: string
          nullable: true
          description: xAI API key (masked)
        tool_choice_chat:
          type: string
          nullable: true
        tool_choice_reasoning:
          type: string
          nullable: true
        tool_choice_copywriting:
          type: string
          nullable: true
        tool_choice_vision:
          type: string
          nullable: true
        tool_choice_hearing:
          type: string
          nullable: true
        tool_choice_images_gen:
          type: string
          nullable: true
        tool_choice_images_edit:
          type: string
          nullable: true
        tool_choice_search:
          type: string
          nullable: true
        tool_choice_embedding:
          type: string
          nullable: true
        tool_choice_api_fiat_exchange:
          type: string
          nullable: true
        tool_choice_api_crypto_exchange:
          type: string
          nullable: true
        tool_choice_api_stock_quote:
          type: string
          nullable: true
        tool_choice_api_twitter:
          type: string
          nullable: true
        is_on_waitlist:
