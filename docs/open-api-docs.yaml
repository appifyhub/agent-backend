openapi: 3.0.3
info:
  title: The Agent's user-facing API
  description: The user-facing parts of The Agent's API service (excluding system-level endpoints, chat completion, maintenance endpoints, etc.)
  version: 5.28.2
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://your.agent.com
    description: Your Agent API

security:
  - bearerAuth: []

paths:
  /attachments/private/{id}:
    get:
      summary: Read attachment privately
      description: Stream attachment bytes for a user who belongs to the attachment's chat
      operationId: getPrivateAttachment
      tags: [Attachments]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Attachment ID
      responses:
        "200":
          description: Attachment bytes streamed successfully
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"
      security:
        - bearerAuth: []

  /attachments/public/{token}:
    get:
      summary: Read attachment with public token
      description: Stream attachment bytes using a short-lived public attachment token
      operationId: getPublicAttachment
      tags: [Attachments]
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
          description: Short-lived public attachment token
      responses:
        "200":
          description: Attachment bytes streamed successfully
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"
      security: []

  /settings/user/{user_id}:
    get:
      summary: Get user settings
      description: Retrieve settings for a specific user
      operationId: getUserSettings
      tags: [Settings]
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
          description: User ID in hexadecimal format (UUID without hyphens)
      responses:
        "200":
          description: Settings retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettingsResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/ServerError"
      security:
        - bearerAuth: []
    patch:
      summary: Update user settings
      description: Save user settings including API keys and tool choices
      operationId: saveUserSettings
      tags: [Settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSettingsPayload"
      responses:
        "200":
          description: User settings saved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/ServerError"
      security:
        - bearerAuth: []

  /settings/user/{user_id}/tools:
    get:
      summary: Get user's external tools configuration
      description: Retrieve external tools and providers configuration status
      operationId: getTools
      tags: [Settings]
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
          description: User ID in hexadecimal format (UUID without hyphens)
      responses:
        "200":
          description: Tools configuration retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalToolsResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"
      security:
        - bearerAuth: []

  /settings/user/{user_id}/products:
    get:
      summary: Get available products
      description: Retrieve the list of purchasable products
      operationId: getProducts
      tags: [Settings]
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
          description: User ID in hexadecimal format (UUID without hyphens)
      responses:
        "200":
          description: Products retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductsResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"
      security:
        - bearerAuth: []

  /settings/chats:
    get:
      summary: Get all chats for the invoker
      description: Retrieve all private and group chats where the invoker has a membership record; admin chats are discovered and their membership is refreshed
      operationId: getChats
      tags: [Chats]
      responses:
        "200":
          description: Chats retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatSettingsResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/ServerError"
      security:
        - bearerAuth: []

  /settings/chats/{chat_id}:
    get:
      summary: Get chat settings
      description: Retrieve settings for a specific chat; creates a membership row with false defaults if the invoker has no existing row
      operationId: getChatSettings
      tags: [Chats]
      parameters:
        - name: chat_id
          in: path
          required: true
          schema:
            type: string
          description: Chat ID in hexadecimal format (UUID without hyphens)
      responses:
        "200":
          description: Chat settings retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSettingsResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"
      security:
        - bearerAuth: []
    patch:
      summary: Update chat settings
      description: Save chat and/or per-user chat configuration; admin-only fields require admin membership; at least one of chat_config or user_chat_config must be present
      operationId: saveChatSettings
      tags: [Chats]
      parameters:
        - name: chat_id
          in: path
          required: true
          schema:
            type: string
          description: Chat ID in hexadecimal format (UUID without hyphens)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatSettingsPayload"
      responses:
        "200":
          description: Chat settings saved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/ServerError"
      security:
        - bearerAuth: []

  /user/{user_id}/sponsorships:
    get:
      summary: Get user's sponsorships
      description: Retrieve all sponsorships created by the user
      operationId: getSponsorships
      tags: [Sponsorships]
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
          description: User ID in hexadecimal format (UUID without hyphens)
      responses:
        "200":
          description: Sponsorships retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SponsorshipsResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"
      security:
        - bearerAuth: []

    post:
      summary: Create a new sponsorship
      description: Sponsor another user by their platform-specific handle
      operationId: sponsorUser
      tags: [Sponsorships]
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
          description: User ID in hexadecimal format (UUID without hyphens)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SponsorshipPayload"
      responses:
        "200":
          description: User sponsored successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SponsorshipCreateResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/ServerError"
      security:
        - bearerAuth: []

  /user/{user_id}/sponsorships/{platform}/{platform_handle}:
    delete:
      summary: Remove a sponsorship
      description: Remove sponsorship for a specific user
      operationId: unsponsorUser
      tags: [Sponsorships]
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
          description: User ID in hexadecimal format (UUID without hyphens)
        - name: platform
          in: path
          required: true
          schema:
            type: string
            enum: [telegram, whatsapp]
          description: Platform type for the handle resolution
        - name: platform_handle
          in: path
          required: true
          schema:
            type: string
          description: Platform-specific handle of the sponsored user (e.g., Telegram username, WhatsApp phone number)
      responses:
        "200":
          description: Sponsorship removed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/ServerError"
      security:
        - bearerAuth: []

  /user/{user_id}/sponsored:
    delete:
      summary: Remove self-sponsorship
      description: User removes their own sponsorship status
      operationId: unsponsorSelf
      tags: [Sponsorships]
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
          description: User ID in hexadecimal format (UUID without hyphens)
      responses:
        "200":
          description: Self-sponsorship removed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"
      security:
        - bearerAuth: []

  /user/{user_id}/transfers:
    post:
      summary: Transfer credits to another user
      description: Transfers credits from the authenticated user to another user identified by platform handle
      operationId: transferCredits
      tags: [CreditTransfers]
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
          description: Sender's user ID in hexadecimal format (UUID without hyphens)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditTransferPayload"
      responses:
        "200":
          description: Credits transferred successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "429":
          description: Insufficient credits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceErrorResponse"
        "500":
          $ref: "#/components/responses/ServerError"
      security:
        - bearerAuth: []

  /user/{user_id}/usage:
    get:
      summary: Get user's usage records
      description: Retrieve paginated usage records for a user with optional date range filtering and sponsorship inclusion
      operationId: getUsageRecords
      tags: [UsageTracking]
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
          description: User ID in hexadecimal format (UUID without hyphens)
        - name: skip
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: Number of records to skip for pagination
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            maximum: 100
          description: Maximum number of records to return (max 100)
        - name: start_date
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Start date for filtering (inclusive). Accepts ISO 8601 format, e.g. "2024-01-15", "2024-01-15T10:30:00", or "2024-01-15T10:30:00+00:00"
        - name: end_date
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: End date for filtering (inclusive). Accepts ISO 8601 format, e.g. "2024-12-31", "2024-12-31T23:59:59", or "2024-12-31T23:59:59+00:00"
        - name: exclude_self
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: When include_sponsored=true, exclude current user's own records
        - name: include_sponsored
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Include usage records from all users sponsored by current user
        - name: include_transfers
          in: query
          required: false
          schema:
            type: boolean
            default: true
          description: Include credit transfer records in results
        - name: only_transfers
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Return only credit transfer records (takes precedence over include_transfers)
        - name: tool_id
          in: query
          required: false
          schema:
            type: string
          description: Filter records to a specific tool by its ID (e.g., "gpt-4o", "claude-3-5-haiku-latest")
        - name: purpose
          in: query
          required: false
          schema:
            type: string
          description: Filter records to a specific purpose (e.g., "chat", "images_gen", "vision")
        - name: provider_id
          in: query
          required: false
          schema:
            type: string
          description: Filter records to a specific provider by its ID (e.g., "open-ai", "anthropic", "google-ai")
      responses:
        "200":
          description: Usage records retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UsageRecord"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/ServerError"
      security:
        - bearerAuth: []

  /user/{user_id}/usage/stats:
    get:
      summary: Get user's aggregated usage statistics
      description: Retrieve aggregated usage statistics including total costs, records by tool, and filter options
      operationId: getUsageStats
      tags: [UsageTracking]
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
          description: User ID in hexadecimal format (UUID without hyphens)
        - name: start_date
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Start date for filtering (inclusive). Accepts ISO 8601 format, e.g. "2024-01-15", "2024-01-15T10:30:00", or "2024-01-15T10:30:00+00:00"
        - name: end_date
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: End date for filtering (inclusive). Accepts ISO 8601 format, e.g. "2024-12-31", "2024-12-31T23:59:59", or "2024-12-31T23:59:59+00:00"
        - name: exclude_self
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: When include_sponsored=true, exclude current user's own records
        - name: include_sponsored
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Include stats from all users sponsored by current user
        - name: include_transfers
          in: query
          required: false
          schema:
            type: boolean
            default: true
          description: Include credit transfer records in stats
        - name: only_transfers
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Return stats for only credit transfer records (takes precedence over include_transfers)
        - name: tool_id
          in: query
          required: false
          schema:
            type: string
          description: Filter aggregates to a specific tool by its ID (e.g., "gpt-4o", "claude-3-5-haiku-latest")
        - name: purpose
          in: query
          required: false
          schema:
            type: string
          description: Filter aggregates to a specific purpose (e.g., "chat", "images_gen", "vision")
        - name: provider_id
          in: query
          required: false
          schema:
            type: string
          description: Filter aggregates to a specific provider by its ID (e.g., "open-ai", "anthropic", "google-ai")
      responses:
        "200":
          description: Usage statistics retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageAggregatesResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"
      security:
        - bearerAuth: []

  /user/{user_id}/purchases:
    get:
      summary: Get user's purchase records
      description: Retrieve paginated purchase records for a user with optional date range and product filtering
      operationId: getPurchaseRecords
      tags: [Purchases]
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
          description: User ID in hexadecimal format (UUID without hyphens)
        - name: skip
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: Number of records to skip for pagination
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            maximum: 100
          description: Maximum number of records to return (max 100)
        - name: start_date
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Start date for filtering (inclusive). Accepts ISO 8601 format, e.g. "2024-01-15", "2024-01-15T10:30:00", or "2024-01-15T10:30:00+00:00"
        - name: end_date
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: End date for filtering (inclusive). Accepts ISO 8601 format, e.g. "2024-12-31", "2024-12-31T23:59:59", or "2024-12-31T23:59:59+00:00"
        - name: product_id
          in: query
          required: false
          schema:
            type: string
          description: Filter records to a specific product by its ID
      responses:
        "200":
          description: Purchase records retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PurchaseRecord"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/ServerError"
      security:
        - bearerAuth: []

    post:
      summary: Bind license key to user account
      description: Associate a Gumroad license key with the user's account for purchases made without a user_id
      operationId: bindLicenseKey
      tags: [Purchases]
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
          description: User ID in hexadecimal format (UUID without hyphens)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BindLicenseKeyPayload"
      responses:
        "200":
          description: License key bound successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseRecord"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/ServerError"
      security:
        - bearerAuth: []

  /user/{user_id}/purchases/stats:
    get:
      summary: Get user's purchase aggregates
      description: Retrieve aggregated purchase statistics including total revenue, net revenue, and breakdown by product
      operationId: getPurchaseStats
      tags: [Purchases]
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
          description: User ID in hexadecimal format (UUID without hyphens)
        - name: start_date
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Start date for filtering (inclusive). Accepts ISO 8601 format, e.g. "2024-01-15", "2024-01-15T10:30:00", or "2024-01-15T10:30:00+00:00"
        - name: end_date
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: End date for filtering (inclusive). Accepts ISO 8601 format, e.g. "2024-12-31", "2024-12-31T23:59:59", or "2024-12-31T23:59:59+00:00"
        - name: product_id
          in: query
          required: false
          schema:
            type: string
          description: Filter aggregates to a specific product by its ID
      responses:
        "200":
          description: Purchase statistics retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseAggregates"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"
      security:
        - bearerAuth: []

  /user/{user_id_hex}/connect-key:
    get:
      summary: Get user's connect key
      description: Retrieve the connect key for the specified user, used to merge profiles from different platforms
      operationId: getConnectKey
      tags: [Profile Connection]
      parameters:
        - name: user_id_hex
          in: path
          required: true
          schema:
            type: string
          description: User ID in hexadecimal format (UUID without hyphens)
      responses:
        "200":
          description: Connect key retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectKeyResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"
      security:
        - bearerAuth: []

  /user/{user_id_hex}/regenerate-connect-key:
    post:
      summary: Regenerate user's connect key
      description: Generate a new connect key for the specified user, invalidating the old key
      operationId: regenerateConnectKey
      tags: [Profile Connection]
      parameters:
        - name: user_id_hex
          in: path
          required: true
          schema:
            type: string
          description: User ID in hexadecimal format (UUID without hyphens)
      responses:
        "200":
          description: Connect key regenerated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectKeyResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"
      security:
        - bearerAuth: []

  /user/{user_id_hex}/connect-key/{connect_key}/merge:
    post:
      summary: Connect profiles from different platforms
      description: Merge two user profiles from different platforms (e.g., Telegram and WhatsApp) into a single unified profile
      operationId: connectProfiles
      tags: [Profile Connection]
      parameters:
        - name: user_id_hex
          in: path
          required: true
          schema:
            type: string
          description: User ID in hexadecimal format (UUID without hyphens) - the requester
        - name: connect_key
          in: path
          required: true
          schema:
            type: string
          description: Connect key of the target profile to merge with
      responses:
        "200":
          description: Profiles connected successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsLinkResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/ServerError"
      security:
        - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from one of the auth flows (usually via the chat)

  schemas:
    JWTPayload:
      type: object
      description: JWT token payload structure for platform-agnostic authentication
      properties:
        iss:
          type: string
          nullable: false
          description: Issuer - The app name that issued the token
        sub:
          type: string
          nullable: false
          description: Subject - The user's unique identifier
        platform:
          type: string
          nullable: false
          enum: [telegram, whatsapp]
          description: Platform where the token was issued
        platform_id:
          type: string
          nullable: true
          description: Platform-specific user ID
        platform_handle:
          type: string
          nullable: true
          description: Platform-specific user handle (username)
        exp:
          type: integer
          nullable: false
          description: Token expiration timestamp (Unix epoch)
        iat:
          type: integer
          nullable: false
          description: Token issued at timestamp (Unix epoch)
        version:
          type: string
          nullable: false
          description: Version of the app that issued the token
      required:
        - iss
        - sub
        - platform
        - exp
        - iat
        - version

    UserSettingsPayload:
      type: object
      properties:
        full_name:
          type: string
          nullable: true
          description: User's full name
        about_me:
          type: string
          nullable: true
          description: Personal information about the user for personalized interactions
        custom_prompt:
          type: string
          nullable: true
          description: Custom instructions for the AI agent to follow during interactions
        open_ai_key:
          type: string
          nullable: true
          description: OpenAI API key
        anthropic_key:
          type: string
          nullable: true
          description: Anthropic API key
        google_ai_key:
          type: string
          nullable: true
          description: Google AI API key
        perplexity_key:
          type: string
          nullable: true
          description: Perplexity API key
        replicate_key:
          type: string
          nullable: true
          description: Replicate API key
        rapid_api_key:
          type: string
          nullable: true
          description: RapidAPI key
        coinmarketcap_key:
          type: string
          nullable: true
          description: CoinMarketCap API key
        twelve_data_api_key:
          type: string
          nullable: true
          description: Twelve Data API key
        x_key:
          type: string
          nullable: true
          description: X / Twitter API key
        x_ai_key:
          type: string
          nullable: true
          description: xAI API key
        tool_choice_chat:
          type: string
          nullable: true
          description: Tool choice for chat functionality
        tool_choice_reasoning:
          type: string
          nullable: true
          description: Tool choice for reasoning tasks
        tool_choice_copywriting:
          type: string
          nullable: true
          description: Tool choice for copywriting tasks
        tool_choice_vision:
          type: string
          nullable: true
          description: Tool choice for vision tasks
        tool_choice_hearing:
          type: string
          nullable: true
          description: Tool choice for audio processing
        tool_choice_images_gen:
          type: string
          nullable: true
          description: Tool choice for image generation
        tool_choice_images_edit:
          type: string
          nullable: true
          description: Tool choice for image editing
        tool_choice_search:
          type: string
          nullable: true
          description: Tool choice for search functionality
        tool_choice_embedding:
          type: string
          nullable: true
          description: Tool choice for embedding generation
        tool_choice_api_fiat_exchange:
          type: string
          nullable: true
          description: Tool choice for fiat currency exchange
        tool_choice_api_crypto_exchange:
          type: string
          nullable: true
          description: Tool choice for cryptocurrency exchange
        tool_choice_api_stock_quote:
          type: string
          nullable: true
