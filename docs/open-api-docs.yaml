        - are_policies_accepted
        - is_sponsored
        - group
        - created_at

    ChatSettingsPayload:
      type: object
      description: At least one of chat_config or user_chat_config must be present; an empty body is rejected
      properties:
        chat_config:
          $ref: "#/components/schemas/ChatConfigPayload"
          nullable: true
          description: Admin-editable chat configuration (requires admin membership)
        user_chat_config:
          $ref: "#/components/schemas/UserChatConfigPayload"
          nullable: true
          description: Per-user chat preferences (any member may update)

    ChatConfigPayload:
      type: object
      properties:
        language_name:
          type: string
          nullable: false
          description: Display name of the language
        language_iso_code:
          type: string
          nullable: false
          description: ISO code of the language
        reply_chance_percent:
          type: integer
          nullable: false
          minimum: 0
          maximum: 100
          description: Percentage chance of replying to messages
        release_notifications:
          type: string
          nullable: false
          enum: [none, major, minor, all]
          description: Release notification settings
        media_mode:
          type: string
          nullable: false
          enum: [photo, file, all]
          description: Media sending mode - photo (send as photo), file (send as file), all (send both photo and file)
      required:
        - language_name
        - language_iso_code
        - reply_chance_percent
        - release_notifications
        - media_mode

    UserChatConfigPayload:
      type: object
      properties:
        use_about_me:
          type: boolean
          nullable: false
          description: Whether to include this user's "about me" in agent interactions for this chat
        use_custom_prompt:
          type: boolean
          nullable: false
          description: Whether to apply this user's custom prompt instructions in agent interactions for this chat
        max_output_tokens:
          type: integer
          nullable: false
          minimum: 1
          description: Maximum number of output tokens the LLM may generate per response (before tool-type multiplier)
        max_chat_history_depth:
          type: integer
          nullable: false
          minimum: 1
          description: Maximum number of past messages to include in the LLM context window
        max_iterations:
          type: integer
          nullable: false
          minimum: 1
          description: Maximum number of agent reasoning/tool-call iterations per request
      required:
        - use_about_me
        - use_custom_prompt

    ChatSettingsResponse:
      type: object
      properties:
        chat_config:
          $ref: "#/components/schemas/ChatConfigResponse"
        user_chat_config:
          $ref: "#/components/schemas/UserChatConfigResponse"
      required:
        - chat_config
        - user_chat_config

    ChatConfigResponse:
      type: object
      properties:
        chat_id:
          type: string
          nullable: false
          description: Chat ID in hexadecimal format (UUID without hyphens)
        title:
          type: string
          nullable: true
          description: Chat title
        platform:
          type: string
          nullable: false
          enum: [telegram, whatsapp]
          description: Platform type of this chat
        language_name:
          type: string
          nullable: true
          description: Display name of the language
        language_iso_code:
          type: string
          nullable: true
          description: ISO code of the language
        reply_chance_percent:
          type: integer
          nullable: false
          minimum: 0
          maximum: 100
          description: Percentage chance of replying to messages
        release_notifications:
          type: string
          nullable: false
          enum: [none, major, minor, all]
          description: Release notification settings
        media_mode:
          type: string
          nullable: false
          enum: [photo, file, all]
          description: Media sending mode - photo (send as photo), file (send as file), all (send both photo and file)
        is_private:
          type: boolean
          nullable: false
          description: Whether the chat is private
        is_own:
          type: boolean
          nullable: false
          description: Whether the chat belongs to the requesting user
        is_admin:
          type: boolean
          nullable: false
          description: Whether the requesting user is an admin of this chat
      required:
        - chat_id
        - platform
        - reply_chance_percent
        - release_notifications
        - media_mode
        - is_private
        - is_own
        - is_admin

    UserChatConfigResponse:
      type: object
      properties:
        use_about_me:
          type: boolean
          nullable: false
          description: Whether this user's "about me" is included in agent interactions for this chat
        use_custom_prompt:
          type: boolean
          nullable: false
          description: Whether this user's custom prompt instructions are applied in agent interactions for this chat
        max_output_tokens:
          type: integer
          nullable: false
          minimum: 1
          description: Maximum number of output tokens the LLM may generate per response (before tool-type multiplier)
        max_chat_history_depth:
          type: integer
          nullable: false
          minimum: 1
          description: Maximum number of past messages included in the LLM context window
        max_iterations:
          type: integer
          nullable: false
          minimum: 1
          description: Maximum number of agent reasoning/tool-call iterations per request
      required:
        - use_about_me
        - use_custom_prompt
        - max_output_tokens
        - max_chat_history_depth
        - max_iterations

    SponsorshipPayload:
      type: object
      properties:
        platform_handle:
          type: string
          nullable: false
          description: Platform-specific handle of the user to sponsor (e.g., Telegram username, WhatsApp phone number)
        platform:
          type: string
          nullable: false
          enum: [telegram, whatsapp]
          description: Platform type for the handle resolution
      required:
        - platform_handle
        - platform

    CreditTransferPayload:
      type: object
      properties:
        platform:
          type: string
          nullable: false
          enum: [telegram, whatsapp]
          description: Platform type for the recipient handle resolution
        platform_handle:
          type: string
          nullable: false
          description: Platform-specific handle of the recipient (e.g., Telegram username, WhatsApp phone number)
        amount:
          type: number
          format: float
          nullable: false
          description: Amount of credits to transfer (minimum 1.0)
        note:
          type: string
          nullable: true
          description: Optional note or reason for the transfer
      required:
        - platform
        - platform_handle
        - amount

    ExternalToolsResponse:
      type: object
      properties:
        tools:
          type: array
          nullable: false
          items:
            $ref: "#/components/schemas/ExternalToolResponse"
          description: List of external tools
        providers:
          type: array
          nullable: false
          items:
            $ref: "#/components/schemas/ExternalToolProviderResponse"
          description: List of external tool providers
        presets:
          type: object
          nullable: false
          additionalProperties:
            type: object
            additionalProperties:
              type: string
          description: Intelligence presets mapping preset names to tool type choices
          example:
            lowest_price:
              chat: "gpt-5-nano"
              reasoning: "gpt-5-nano"
            agent_choice:
              chat: "gpt-5.4"
              reasoning: "claude-sonnet-4-6"
      required:
        - tools
        - providers
        - presets

    ProductsResponse:
      type: object
      properties:
        products:
          type: array
          nullable: false
          items:
            $ref: "#/components/schemas/ConfiguredProduct"
          description: List of purchasable products
      required:
